name: Build Doodh Dairy APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'DoodhDairy_Android_Starter.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          unzip DoodhDairy_Android_Starter.zip -d extracted
          find extracted -name settings.gradle -type f

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle -type f | head -n 1)")
          test -n "$PROJECT_DIR"
          sed -i "/com.google.gms.google-services/d" "$PROJECT_DIR/app/build.gradle"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DoodhDairy-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
