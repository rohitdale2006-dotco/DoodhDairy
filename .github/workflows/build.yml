name: Build Doodh Dairy APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip Starter Project
        run: |
          if [ -f DoodhDairy_Android_Starter.zip ]; then
            unzip DoodhDairy_Android_Starter.zip
            if [ -d DoodhDairy_Android_Starter ]; then
              mv DoodhDairy_Android_Starter/* .
              mv DoodhDairy_Android_Starter/.* . 2>/dev/null || true
              rm -rf DoodhDairy_Android_Starter
            fi
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/setup-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
